spring.application.name=coreservices

server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
# In Docker, 'postgres' is the container name (not localhost)
# Falls back to localhost for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sylab_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:codex}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.remember-me-expiration-ms=${APP_JWT_REMEMBER_ME_EXPIRATION_MS:2592000000}
app.jwt.cookie-name=${APP_JWT_COOKIE_NAME:sylab_jwt}
app.sync.internal-secret=${APP_SYNC_INTERNAL_SECRET:sylab-internal-cron-secret-key-2026}