databases:
  - name: sylab-postgres
    databaseName: sylab_db
    user: sylab_user
    plan: free # Can be upgraded to starter/standard later

services:
  # 1. Spring Boot Core Services
  - type: web
    name: sylab-core
    plan: free
    env: docker
    rootDir: SYLAB_Backend
    dockerContext: ./coreservices
    dockerfilePath: ./coreservices/Dockerfile
    envVars:
      - key: PORT
        value: "8081"
      - key: DB_HOST
        fromDatabase:
          name: sylab-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sylab-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sylab-postgres
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: sylab-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: sylab-postgres
          property: password
      - key: APP_JWT_SECRET
        generateValue: true # Render will auto-generate a secure random string
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_JWT_REMEMBER_ME_EXPIRATION_MS
        value: "2592000000"
      - key: APP_JWT_COOKIE_NAME
        value: "sylab_jwt"
      - key: APP_SYNC_INTERNAL_SECRET
        generateValue: true 

  # 2. FastAPI Gateway
  - type: web
    name: sylab-gateway
    plan: free
    env: docker
    rootDir: SYLAB_Backend
    dockerContext: ./gateway
    dockerfilePath: ./gateway/Dockerfile
    envVars:
      - key: CORESERVICES_BASE_URL
        value: http://sylab-core:8081 # Internal network call to Core Services
      - key: INTERNAL_SYNC_SECRET
        fromService:
          type: web
          name: sylab-core
          envVarKey: APP_SYNC_INTERNAL_SECRET
      - key: DEBUG
        value: "false"
